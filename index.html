<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEG Stage PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
body {
    font-family: sans-serif;
    background:#f1f5f9;
    padding:20px;
}
.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:20px;
}
input {
    width:100%;
    margin:8px 0;
    padding:10px;
}
button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:20px;
    border:none;
    background:#3b82f6;
    color:#fff;
    font-weight:bold;
}
#installBtn {display:none;}
.result {
    margin-top:20px;
    background:#000;
    color:#fff;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>FEG Stage PRO</h2>

<input id="w" type="number" value="4" placeholder="Ширина">
<input id="d" type="number" value="3" placeholder="Глубина">
<input id="price" type="number" value="850" placeholder="Цена модуля">
<input id="install" type="number" value="3500" placeholder="Монтаж">

<button onclick="calc()">Рассчитать</button>
<button id="installBtn">Установить приложение</button>

<div id="res" class="result"></div>

</div>

<script>
// расчет
function calc(){
    let w = +document.getElementById('w').value;
    let d = +document.getElementById('d').value;
    let price = +document.getElementById('price').value;
    let install = +document.getElementById('install').value;

    let modules = w*d;
    let total = modules*price + install;

    document.getElementById('res').innerHTML =
        `Модули: ${modules}<br>Итого: ${total} ₽`;
}

// PWA install
let deferredPrompt;
const btn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    btn.style.display = "block";
});

btn.onclick = async ()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
};

// iOS hint
if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    alert("Нажмите «Поделиться» → «На экран Домой»");
}

// service worker
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
