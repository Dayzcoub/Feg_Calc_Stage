<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FEG Stage PRO 3.1.88</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07090B">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" integrity="sha512-plOdviVmws4Y3JAvbnpfKb2hVxKM1lCwsi3vmElYRj+tiDLffZ4FVUj5a8vyKJ9pIgl8JCAHEJ4D1iUKBecswg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080c10;
            --panel: #10171e;
            --panel-2: #141c24;
            --panel-3: #1a232c;
            --line: #2a333c;
            --line-soft: rgba(255,255,255,0.08);
            --text: #f3f6f8;
            --ink: #f3f6f8;
            --muted: #a6b0bb;
            --muted-2: #7e8a96;
            --accent: #2F4F4F;
            --accent-dark: #213838;
            --accent-soft: rgba(47,79,79,0.18);
            --danger: #ef4444;
            --success: #9bbb64;
            --wood-1: #6e573f;
            --wood-2: #4a3529;
            --wood-3: #2b211c;
            --wood-line: rgba(236, 210, 172, 0.42);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, rgba(196,160,111,0.16), transparent 28%), linear-gradient(135deg, #090d10 0%, #111820 45%, #0b1015 100%);
            padding: 20px 16px 40px;
            color: var(--text);
        }

        .app-container {
            max-width: 980px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(21,29,37,0.98), rgba(12,17,22,0.98));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45);
            overflow: hidden;
            padding: 24px 20px 32px;
            transition: all 0.2s ease;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 12px 32px;
            }
            .app-container {
                padding: 20px 16px 28px;
                border-radius: 28px;
            }
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 22px;
        }
        .logo {
            flex: 0 0 auto;
        }
        .logo img {
            width: 148px;
            max-width: 34vw;
            height: auto;
            border-radius: 24px;
            border: 1px solid rgba(199,167,122,0.35);
            box-shadow: 0 16px 38px rgba(0,0,0,0.32);
            display: block;
        }
        .app-title {
            flex: 1;
            min-width: 0;
        }
        .app-title h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text);
            font-weight: 850;
        }
        .app-title h1 span {
            color: var(--accent);
        }
        .app-title p {
            margin-top: 10px;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.18rem);
        }
        @media (max-width: 640px) {
            .app-header { align-items: flex-start; gap: 14px; }
            .logo img { width: 104px; border-radius: 20px; }
            .app-title h1 { font-size: 1.85rem; }
            .app-title p { font-size: 0.92rem; }
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1.5rem 0 0.75rem 0;
            color: var(--text);
            letter-spacing: -0.2px;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }
        h3:first-of-type {
            margin-top: 0;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }
        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }
        .field.small {
            flex: 1;
            min-width: 120px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input, select {
            background: #0f151c;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            color: var(--text);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196,160,111,0.22);
            background: #111820;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 40px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            background: #141c24;
        }
        button:hover {
            background: #1b2630;
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 16px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-color: var(--accent);
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #d1b184, #8d6d46);
            border-color: #d1b184;
        }
        .btn-secondary {
            background: #111820;
            border-color: var(--line);
            color: var(--text);
        }
        .btn-success {
            background: linear-gradient(135deg, #8aa85a, #5f7939);
            border-color: #8aa85a;
            color: white;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #9bbb64, #6e8d42);
            border-color: #9bbb64;
        }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.35);
            color: #fecaca;
        }
        .btn-danger:hover {
            background: rgba(239,68,68,0.2);
            border-color: rgba(239,68,68,0.55);
        }

        .client-area, .stage-editor-card {
            background: linear-gradient(180deg, #141c24, #10161d);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 8px;
            border: 1px solid var(--line);
        }
        .flex-client {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .flex-client .field {
            margin-bottom: 0;
        }
        .client-select-block {
            margin-top: 12px;
        }
        .hint {
            font-size: 0.75rem;
            color: var(--muted-2);
            margin-top: 4px;
            line-height: 1.35;
        }

        .grid-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 14px;
        }
        .grid-toolbar .field {
            min-width: 110px;
            max-width: 160px;
        }

        .stage-grid-wrap {
            width: 100%;
            overflow: auto;
            scrollbar-gutter: stable both-edges;
            overscroll-behavior: contain;
            contain: layout paint;
            background: radial-gradient(circle at 30% 20%, rgba(199,167,122,0.05), transparent 26%), #0c1217;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .stage-grid {
            --cell-size: 30px;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols, 20), var(--cell-size));
            grid-template-rows: repeat(var(--grid-rows, 20), var(--cell-size));
            gap: 0;
            width: max-content;
            margin: 0 auto;
            user-select: none;
            touch-action: none;
            contain: layout paint;
        }
        .stage-cell {
            appearance: none;
            -webkit-appearance: none;
            box-sizing: border-box;
            display: block;
            width: var(--cell-size);
            height: var(--cell-size);
            min-width: var(--cell-size);
            min-height: var(--cell-size);
            border-radius: 0;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.025);
            cursor: crosshair;
            position: relative;
            padding: 0;
            margin: 0;
            line-height: 1;
            box-shadow: none;
            transform: none !important;
            transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .stage-cell:hover {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px rgba(196,160,111,0.42), 0 0 0 1px rgba(196,160,111,0.18);
        }
        .stage-grid .stage-cell:hover {
            transform: none !important;
        }
        .stage-cell.active {
            background-color: #382923;
            background-image:
                radial-gradient(ellipse at 50% 50%, rgba(169,134,96,0.42) 0 12%, transparent 13% 100%),
                radial-gradient(ellipse at 50% 50%, rgba(16,12,10,0.72) 0 23%, transparent 24% 100%),
                linear-gradient(45deg, transparent 45%, rgba(214,180,132,0.28) 46%, rgba(214,180,132,0.28) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 45%, rgba(214,180,132,0.18) 46%, rgba(214,180,132,0.18) 51%, transparent 52%),
                linear-gradient(135deg, #6b523d 0%, #4b382d 45%, #241b18 100%);
            background-size: 15px 15px, 15px 15px, 15px 15px, 15px 15px, 100% 100%;
            border-color: rgba(199,167,122,0.72);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), inset 0 -3px 5px rgba(0,0,0,0.32), 0 0 10px rgba(199,167,122,0.12);
        }
        .stage-cell.active::after {
            content: '';
            position: absolute;
            inset: 7px;
            border-radius: 4px;
            border: 1px solid rgba(236,210,172,0.22);
        }
        .stage-cell.origin {
            outline: 2px dashed rgba(59,130,246,0.35);
            outline-offset: -4px;
        }
        .stage-cell.front-row::before {
            content: '';
            position: absolute;
            left: 7px;
            right: 7px;
            bottom: 3px;
            height: 2px;
            border-radius: 4px;
            background: rgba(196,160,111,0.75);
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #10171e;
        }
        .zoom-control label {
            white-space: nowrap;
            margin: 0;
        }
        .zoom-control input[type=range] {
            flex: 1;
            min-width: 120px;
            padding: 0;
            border: 0;
            accent-color: var(--accent);
            background: transparent;
        }
        .zoom-control output {
            min-width: 68px;
            text-align: right;
            color: var(--accent);
            font-weight: 800;
        }

        .grid-caption {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        .canvas-template-card {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(22,31,39,.94), rgba(14,20,26,.96));
        }
        .template-inline {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .canvas-template-card .field {
            min-width: 0;
        }
        .canvas-template-card .module-size-note {
            padding: 0 0 10px;
            border-bottom: 1px solid rgba(255,255,255,.075);
        }

        .result-card {
            background: linear-gradient(180deg, #151d25, #10161d);
            border-radius: 28px;
            padding: 6px 0;
            margin: 18px 0 10px;
            border: 1px solid var(--line);
            overflow: hidden;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
        }
        .result-grid div {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-weight: 500;
        }
        .result-grid div:nth-child(odd) {
            background-color: #18212a;
            font-weight: 600;
            color: var(--muted);
        }
        .result-grid div:nth-child(even) {
            background-color: #111820;
            text-align: right;
            font-weight: 700;
            color: #d7b989;
        }
        .result-grid div:last-child, .result-grid div:nth-last-child(2) {
            border-bottom: none;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .order-card {
            background: #121a22;
            border-radius: 24px;
            border: 1px solid var(--line);
            padding: 16px 18px;
            transition: 0.1s linear;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .order-info { flex: 3; }
        .order-info strong {
            font-size: 1.05rem;
            color: var(--text);
            display: inline-block;
            margin-right: 12px;
        }
        .order-info .project-name {
            font-weight: 500;
            color: var(--muted);
            background: #0e141a;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: inline-block;
        }
        .order-info .order-details {
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .order-price {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text);
            background: rgba(196,160,111,0.14);
            padding: 5px 16px;
            border-radius: 60px;
        }
        .delete-order {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--muted);
            padding: 6px 10px;
            border-radius: 40px;
            transition: all 0.15s;
            line-height: 1;
        }
        .delete-order:hover {
            color: #dc2626;
            background: rgba(239,68,68,0.12);
            transform: scale(1.05);
        }

        #pdfContent {
            background: white;
            padding: 16px;
            font-family: 'Inter', system-ui, sans-serif;
            max-width: 1400px;
            line-height: 1.35;
            color: #000;
        }
        #pdfContent h2 {
            color: #1e293b;
            margin-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            font-size: 20px;
        }
        #pdfData {
            margin-top: 8px;
            font-size: 12px;
        }

        .pdf-mini-grid {
            display: grid;
            grid-template-columns: repeat(var(--pdf-grid-cols, 20), var(--pdf-cell-size, 14px));
            gap: 1px;
            margin-top: 6px;
            width: max-content;
            background: #d7dde3;
            padding: 4px;
            border: 1px solid #aeb7c0;
        }
        .pdf-mini-cell {
            width: var(--pdf-cell-size, 14px);
            height: var(--pdf-cell-size, 14px);
            border: 1px solid #c5ccd3;
            background: #ffffff;
        }
        .pdf-mini-cell.active {
            background-color: #4a3529;
            border-color: #201712;
            background-image:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.16) 0 1px, transparent 1px),
                linear-gradient(135deg, rgba(196,160,111,0.35), rgba(48,35,27,0.35)),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 5px);
        }
        .tech-pdf {
            font-family: Inter, Arial, sans-serif;
            color: #101820;
        }
        .tech-pdf .tech-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 8px 0 10px;
            font-size: 11px;
        }
        .tech-pdf .tech-box {
            border: 1px solid #222;
            padding: 8px 10px;
            min-height: auto;
        }
        .tech-pdf .section-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .2px;
            text-transform: uppercase;
            margin: 10px 0 5px;
            border-bottom: 1px solid #111;
            padding-bottom: 3px;
        }
        .tech-pdf table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }
        .tech-pdf th,
        .tech-pdf td {
            border: 1px solid #222;
            padding: 4px 5px;
            vertical-align: middle;
        }
        .tech-pdf th {
            background: #e7e1d7;
            text-align: left;
            font-weight: 800;
        }
        .tech-pdf .qty {
            text-align: center;
            font-weight: 800;
            font-size: 11px;
            width: 72px;
        }
        .tech-pdf .scheme-row {
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 10px;
            align-items: start;
        }
        .tech-pdf .notes {
            font-size: 10px;
            line-height: 1.3;
        }
        .tech-pdf .signature-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 12px;
            font-size: 10px;
        }
        .tech-pdf .sign-line {
            border-top: 1px solid #111;
            padding-top: 6px;
        }





        .client-pdf {
            font-family: Inter, Arial, sans-serif;
            color: #111820;
            background: #ffffff;
        }
        .client-pdf .client-hero {
            display: grid;
            grid-template-columns: 1.25fr .75fr;
            gap: 18px;
            align-items: stretch;
            background: linear-gradient(135deg, #111820 0%, #1f2933 58%, #3a2a20 100%);
            color: #ffffff;
            border-radius: 18px;
            padding: 20px 22px;
            margin-bottom: 14px;
        }
        .client-pdf .brand-title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.7px;
            line-height: 1.05;
        }
        .client-pdf .brand-title span { color: #c4a06f; }
        .client-pdf .brand-subtitle {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.78);
            max-width: 540px;
        }
        .client-pdf .client-meta {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.55;
        }
        .client-pdf .client-main-grid {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            gap: 14px;
            align-items: start;
        }
        .client-pdf .client-card {
            border: 1px solid #d7dde3;
            border-radius: 16px;
            padding: 14px;
            background: #ffffff;
        }
        .client-pdf .client-section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .4px;
            font-weight: 900;
            color: #111820;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #c4a06f;
        }
        .client-pdf .client-scheme-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 230px;
            background: #f3f0ea;
            border-radius: 14px;
            border: 1px solid #ded6ca;
            padding: 12px;
        }
        .client-scheme-grid {
            display: grid;
            grid-template-columns: repeat(var(--client-grid-cols, 1), var(--client-cell-size, 28px));
            gap: 3px;
            width: max-content;
        }
        .client-scheme-cell {
            width: var(--client-cell-size, 28px);
            height: var(--client-cell-size, 28px);
            border: 1px solid #cabaa7;
            border-radius: 4px;
            background: rgba(255,255,255,0.48);
        }
        .client-scheme-cell.active {
            background-color: #5a3f2f;
            border-color: #2a1b14;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
            background-image:
                radial-gradient(circle at 28% 28%, rgba(255,255,255,0.16) 0 1px, transparent 1px),
                linear-gradient(135deg, rgba(196,160,111,0.42), rgba(48,35,27,0.28)),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.09) 0 1px, transparent 1px 5px);
        }
        .client-pdf .client-params {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }
        .client-pdf .client-param {
            background: #f7f4ef;
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid #e7dfd3;
        }
        .client-pdf .client-param span {
            display: block;
            color: #69727d;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .3px;
            margin-bottom: 3px;
        }
        .client-pdf .client-param strong {
            font-size: 15px;
            color: #111820;
        }
        .client-pdf .client-price-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid #d7dde3;
            font-size: 13px;
        }

        .truss-grid {
            position: relative;

            grid-template-columns: repeat(var(--truss-cols, 16), var(--truss-cell, 28px));
            grid-template-rows: repeat(var(--truss-rows, 12), var(--truss-cell, 28px));
            width: max-content;
            height: max-content;
            background-image:
                linear-gradient(to right, rgba(255,255,255,.10) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,.10) 1px, transparent 1px);
            background-size: var(--truss-cell, 28px) var(--truss-cell, 28px);
            background-position: 0 0;
            border-right: 1px solid rgba(255,255,255,.10);
            border-bottom: 1px solid rgba(255,255,255,.10);

        .truss-hit {
            width: var(--truss-cell, 28px);

<script>
(function () {
  'use strict';
  function bootQuickStandalone() {
    var ROOT = window.FEGModules || {};
    var mount = document.getElementById('quickStandaloneMount');
    var status = document.getElementById('quickStandaloneStatus');
    if (!mount) return;
    window.showToast = window.showToast || function (message) {
      if (ROOT.ToastManager && ROOT.ToastManager.showToast) return ROOT.ToastManager.showToast(message);
      var box = document.querySelector('[data-standalone-toast]');
      if (!box) return;
      box.textContent = message || '';
      box.classList.add('show');
      clearTimeout(box._timer);
      box._timer = setTimeout(function () { box.classList.remove('show'); }, 2400);
    };
    try {
      if (!ROOT.QuickCalculators || !ROOT.QuickCalculators.renderQuickCalculators) {
        mount.innerHTML = '<div class="v4-card"><div class="v4-kicker">Standalone error</div><h3>Модуль QuickCalculators не загружен</h3><p class="v4-muted">Проверь целостность архива и пути src/modules.</p></div>';
        return;
      }
      var localUser = { id:'quick-standalone-local', displayName:'FEG Stage PRO 3.1.88', email:'local@feg.quick', role:'admin', workspaceName:'FEG Stage PRO 3.1.88' };
      var authState = { isAuthenticated:true, isDemo:true, role:'admin', user:localUser, workspaceId:'standalone', permissions:['*','quick_pricing:view','prices:view'] };
      ROOT.QuickCalculators.renderQuickCalculators(mount, {
        authState: authState,
        user: localUser,
        role: 'admin',
        showQuickPricing: true,
        quickPricingVisible: true,
        onOpen: function (kind) { if (window.showToast) window.showToast('Открыт быстрый конструктор: ' + kind); }
      });
      if (status) status.textContent = 'FEG Stage PRO 3.1.88 · Standalone Quick Constructors · Stage / Truss / LED';
      if (ROOT.QuickCalculators && ROOT.QuickCalculators.selectCalculator) {
        document.querySelectorAll('[data-feg-nav-kind]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            ROOT.QuickCalculators.selectCalculator(mount, btn.getAttribute('data-feg-nav-kind'), { scroll:true });
          });
        });
        document.querySelectorAll('[data-feg-open-home]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            window.scrollTo({ top:0, behavior:'smooth' });
          });
        });
      }
      document.body.classList.add('quick-standalone-ready');
    } catch (error) {
      console.error(error);
      mount.innerHTML = '<div class="v4-card"><div class="v4-kicker">Standalone error</div><h3>Не удалось открыть быстрые конструкторы</h3><p class="v4-muted">' + String(error && error.message || error).replace(/[&<>]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]);}) + '</p></div>';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootQuickStandalone);
  else bootQuickStandalone();
})();
</script>
